services:
  db:
    image: postgres:16
    container_name: news-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsadmin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-news_admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - news_admin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsadmin} -d ${POSTGRES_DB:-news_admin}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  news_admin_pgdata: